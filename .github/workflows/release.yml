# Builds the desktop app for macOS (Apple Silicon and Intel), Windows and Linux, and publishes
# a GitHub release with the installers plus the `latest.json` manifest the in-app updater reads.
#
# Trigger it by pushing a tag `v<version>` whose version matches `lucidfish/__init__.py`,
# `desktop/src-tauri/tauri.conf.json` and `desktop/package.json` (the version check below
# refuses to build otherwise), or run it by hand from the Actions tab for a dry run.
#
# Secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD   (required: signs the updates;
#       see desktop/README.md for how the key pair is made)
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID                        (optional: notarised macOS builds)

name: Release desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Versions agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag, the package and the app must carry the same version
        run: python desktop/scripts/check_version.py ${{ github.ref_type == 'tag' && github.ref_name || '' }}

  build:
    name: ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-14
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-13
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install Lucidfish and PyInstaller
        run: python -m pip install --upgrade pip && python -m pip install . pyinstaller

      - name: Build the backend (sidecar)
        run: python desktop/scripts/build_sidecar.py --target ${{ matrix.target }}

      - name: Bundle Stockfish
        run: python desktop/scripts/fetch_stockfish.py --target ${{ matrix.target }}

      - name: Install the Tauri CLI
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: desktop
          tauriScript: npm run tauri --
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Lucidfish ${{ github.ref_type == 'tag' && github.ref_name || '(dry run)' }}
          releaseBody: |
            Downloads for macOS, Windows and Linux are below. The app updates itself from here on:
            Settings → About & updates → Check for updates, or accept the banner when a new version appears.

            - **macOS**: `.dmg` (Apple Silicon: `aarch64`; Intel: `x64`). If macOS says the app is damaged
              or from an unidentified developer, right-click it → Open once.
            - **Windows**: `.exe` installer (NSIS) or `.msi`.
            - **Linux**: `.AppImage` (any distribution), `.deb` (Debian/Ubuntu) or `.rpm` (Fedora).
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
