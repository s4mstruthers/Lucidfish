name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Stockfish (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y stockfish

      - name: Install Stockfish (macOS)
        if: runner.os == 'macOS'
        run: brew install stockfish

      - name: Install Lucidfish
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check lucidfish tests

      - name: Check the web UI script parses
        run: node --check lucidfish/static/app.js

      - name: Tests (engine tests are skipped where Stockfish isn't installed)
        run: python -m pytest -q

  desktop:
    name: Desktop shell compiles
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version numbers agree
        run: python desktop/scripts/check_version.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: A placeholder sidecar (the real one is built by the release workflow)
        run: touch desktop/src-tauri/binaries/lucidfish-server-x86_64-unknown-linux-gnu
      - name: cargo check
        working-directory: desktop/src-tauri
        run: cargo check --locked
