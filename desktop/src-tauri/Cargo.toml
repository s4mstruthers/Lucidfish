[package]
name = "lucidfish-desktop"
version = "0.4.0"
description = "Lucidfish: Stockfish tells you the best move, Lucidfish tells you why."
authors = ["Lucidfish contributors"]
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "lucidfish_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
